# application-local.yml
server:
  port: 8096
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: rutix

  rabbitmq:
    host: localhost        # ← Cambiado de 'rabbitmq' a 'localhost'
    port: 5672
    username: guest
    password: guest

  boot:
    admin:
      client:
        url: http://localhost:8086   # ← Cambiado de 'ms-admin'

  datasource:
    url: jdbc:mariadb://localhost:3307/mep  # ← Cambiado de 'mariadb'
    driverClassName: org.mariadb.jdbc.Driver
    platform: org.hibernate.dialect.MariaDBDialect
    username: elementarystudio
    password: YXFzd2RlZnI=

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        show_sql: true
        use_sql_comments: false
        format_sql: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8082/eureka/  # ← Cambiado de 'ms-eureka'
  instance:
    prefer-ip-address: true

Feign:
  hystrix:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans  # ← Cambiado de 'zipkin'
  metrics:
    tags:
      application: rutix
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: info, health, prometheus, metrics
mercadopago:
  access-token: TEST-2857575870989415-041020-9ea5aab0089e2206cff5456f43f0f642-518631706
  notification-url: https://passably-pranker-gotten.ngrok-free.dev/v1/reservas/pagar/mercadopago/webhook
  back-urls:
    success: https://passably-pranker-gotten.ngrok-free.dev/v1/reservas/pagar/mercadopago/retorno?estado=success
    pending: https://passably-pranker-gotten.ngrok-free.dev/v1/reservas/pagar/mercadopago/retorno?estado=pending
    failure: https://passably-pranker-gotten.ngrok-free.dev/v1/reservas/pagar/mercadopago/retorno?estado=failure

security:
